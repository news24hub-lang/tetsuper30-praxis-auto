name: Daily Quiz Auto Generator
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install gTTS
        run: pip install google-api-python-client google-auth gtts requests
      - name: Run Quiz Generator
        env:
          BLOG_ID: ${{ secrets.BLOGGER_ID }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          GOOGLE_KEY_JSON: ${{ secrets.BLOGGER_TOKEN }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: python main.py
      - name: Commit files
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "update" || true
          git push
