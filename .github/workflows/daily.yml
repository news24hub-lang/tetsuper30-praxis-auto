name: Daily Quiz Auto Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

    - name: Install dependencies
    run: pip install gTTS

      - name: Generate Quizzes
        run: python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "TETSuper30-Bot"
          git config --global user.email "bot@tetsuper30.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto quiz $(date +%Y-%m-%d)"
          git push
